name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive (no code signing)
        run: |
          xcodebuild \
            -project WaveFM.xcodeproj \
            -scheme WaveFM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WaveFM.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/WaveFM.xcarchive/Products/Applications/WaveFM.app" Payload/
          codesign --force --sign - Payload/WaveFM.app
          zip -qry WaveFM.ipa Payload
          ls -lh WaveFM.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaveFM-IPA
          path: WaveFM.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### WaveFM IPA 构建成功 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- 产物: WaveFM-IPA (见 Artifacts)" >> $GITHUB_STEP_SUMMARY
