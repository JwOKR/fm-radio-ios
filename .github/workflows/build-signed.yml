name: Build Signed IPA

# 可选：使用自己的 Apple 开发者证书签名，产出可直接安装的 IPA。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   CERT_P12_BASE64         开发者证书 .p12 的 base64
#   CERT_PASSWORD           .p12 密码
#   PROV_PROFILE_BASE64     .mobileprovision 的 base64
#   PROV_PROFILE_NAME       描述文件名称（可选，默认 WaveFM）
#   TEAM_ID                 Apple Developer Team ID
# 未配置 Secrets 时该工作流会跳过并提示。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-signed.yml']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.CERT_P12_BASE64 }}
          PROV: ${{ secrets.PROV_PROFILE_BASE64 }}
          TEAM: ${{ secrets.TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROV" ] && [ -n "$TEAM" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "::warning::签名 Secrets 未配置完整，本次跳过。"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Import signing materials
        env:
          P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          PROV_BASE64: ${{ secrets.PROV_PROFILE_BASE64 }}
          PROV_NAME: ${{ secrets.PROV_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASS="wavefm-ci"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROV_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROV_DIR"
          echo "$PROV_BASE64" | base64 --decode -o "$PROV_DIR/${PROV_NAME:-WaveFM}.mobileprovision"

          # 把签名设置注入工程（XcodeGen 生成后）
          python3 - <<PY
          import re
          p = "WaveFM.xcodeproj/project.pbxproj"
          s = open(p, encoding="utf-8").read()
          s = s.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual;')
          s = s.replace('DEVELOPMENT_TEAM = "";', 'DEVELOPMENT_TEAM = "$TEAM_ID";')
          s = s.replace('CODE_SIGN_IDENTITY = "";', 'CODE_SIGN_IDENTITY = "iPhone Developer";')
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Archive & export
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild \
            -project WaveFM.xcodeproj \
            -scheme WaveFM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WaveFM.xcarchive" \
            -allowProvisioningUpdates \
            clean archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WaveFM.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: WaveFM-IPA-signed
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 90
          if-no-files-found: error
